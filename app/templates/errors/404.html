{% extends "base.html" %}

{% block title %}Page Not Found – 404{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="p-4 bg-white rounded-4 border shadow-sm">
            <div class="display-1 fw-bold text-teal mb-2" style="color: #0f766e;">404</div>
            <h4 class="fw-bold mb-2">Campus Page or Item Not Found</h4>
            <p class="text-muted small mb-4">The item or page you are looking for may have been removed, sold, or renamed.</p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('listings.index') }}" class="btn btn-campus">
                    <i class="bi bi-search me-1"></i> Browse Campus Items
                </a>
                <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary">
                    Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
