{% extends "base.html" %}

{% block title %}Server Error – 500{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="p-4 bg-white rounded-4 border shadow-sm">
            <div class="display-1 fw-bold text-danger mb-2">500</div>
            <h4 class="fw-bold mb-2">Internal Server Error</h4>
            <p class="text-muted small mb-4">Something went wrong on our end. The campus database transaction was safely rolled back.</p>
            <a href="{{ url_for('main.index') }}" class="btn btn-campus">
                <i class="bi bi-house-door me-1"></i> Return Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
