{% extends "base.html" %}

{% block title %}Access Denied – 403{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="p-4 bg-white rounded-4 border shadow-sm">
            <div class="display-1 fw-bold text-danger mb-2">403</div>
            <h4 class="fw-bold mb-2">Access Denied</h4>
            <p class="text-muted small mb-4">You do not have permission to access this campus resource or action.</p>
            <a href="{{ url_for('main.index') }}" class="btn btn-campus">
                <i class="bi bi-house-door me-1"></i> Return to Campus Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
